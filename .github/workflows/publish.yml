name: Publish Package
on:
  push:
    tags:
      - 'v*'
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test --if-present
      - run: npm publish --access public

  publish-mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - uses: actions/checkout@v4

      # The registry entry must point at the version npm just published, so the
      # version comes from package.json rather than from the tag name.
      - name: Set version in server.json from package.json
        run: |
          VERSION=$(jq -r .version package.json)
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "server.json version: $VERSION"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      # The registry checks mcpName in the published npm package, which can
      # take a minute to become visible after npm publish.
      - name: Publish server to the MCP registry
        run: |
          for i in $(seq 1 6); do
            ./mcp-publisher publish && exit 0
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          exit 1

  bump-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Wait for tarball availability
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -sI "https://github.com/aloth/olcli/archive/refs/tags/${{ github.ref_name }}.tar.gz" -o /dev/null -w '%{http_code}')
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "Tarball ready (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, waiting 5s..."
            sleep 5
          done
          echo "Tarball not available after 50s"
          exit 1
      - name: Bump Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: olcli
          homebrew-tap: aloth/homebrew-tap
          tag-name: ${{ github.ref_name }}
          download-url: https://github.com/aloth/olcli/archive/refs/tags/${{ github.ref_name }}.tar.gz
          create-pullrequest: false
          commit-message: |
            olcli: bump to {{version}}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
