name: Publish Experimental Package

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-experimental to continue
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: >-
      github.repository == 'xyin-anl/olcli' &&
      inputs.confirmation == 'publish-experimental'
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
      - run: npm pack --dry-run
      - name: Verify fork package identity
        run: |
          test "$(node -p "require('./package.json').name")" = "@xyin-anl/olcli"
          test "$(node -p "require('./package.json').publishConfig.tag")" = "experimental"
          node -e "if (!require('./package.json').version.includes('-experimental.')) process.exit(1)"
      - run: npm publish
